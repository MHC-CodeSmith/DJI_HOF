load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1998;
        chunk_size 4096;
        timeout 10s;
        application live {
            live on;
            
            # Record the raw stream to preserve GPS for mapping
            record all;
            record_path /home/mhc/Germany/Drone/DJI_HOF/datasets/livestreams;
            record_unique on;
        }
    }
}