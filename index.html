<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Live Flight Vegetation Monitor</title>

  <!-- Bootstrap for layout -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Leaflet for map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Heatmap plugin -->
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <style>
    body { background-color: #f8f9fa; }
    #map { height: 70vh; border: 1px solid #ccc; }
    .stat-card { min-width: 180px; }
    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 5px;
    }
    .status-healthy { background-color: #28a745; }
    .status-moderate { background-color: #ffc107; }
    .status-unhealthy { background-color: #dc3545; }
  </style>
</head>
<body>
<div class="container-fluid p-3">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Live Flight Vegetation Monitor</h3>
    <div>
      <small class="text-muted" id="lastUpdate">Waiting for data...</small>
      <button class="btn btn-sm btn-outline-secondary ms-2" onclick="toggleAutoUpdate()">
        <span id="autoUpdateStatus">Auto: ON</span>
      </button>
    </div>
  </div>

  <!-- Stats row -->
  <div class="row g-3 mb-3">
    <div class="col-auto">
      <div class="card stat-card">
        <div class="card-body">
          <h6 class="card-title mb-1">Total Points</h6>
          <span id="totalPoints" class="fw-bold">0</span>
        </div>
      </div>
    </div>
    <div class="col-auto">
      <div class="card stat-card">
        <div class="card-body">
          <h6 class="card-title mb-1">Avg Health</h6>
          <span id="avgHealth" class="fw-bold">-</span>%
        </div>
      </div>
    </div>
    <div class="col-auto">
      <div class="card stat-card">
        <div class="card-body">
          <h6 class="card-title mb-1">
            <span class="status-indicator status-healthy"></span>Healthy
          </h6>
          <span id="healthyCount" class="fw-bold">0</span>
        </div>
      </div>
    </div>
    <div class="col-auto">
      <div class="card stat-card">
        <div class="card-body">
          <h6 class="card-title mb-1">
            <span class="status-indicator status-moderate"></span>Moderate
          </h6>
          <span id="moderateCount" class="fw-bold">0</span>
        </div>
      </div>
    </div>
    <div class="col-auto">
      <div class="card stat-card">
        <div class="card-body">
          <h6 class="card-title mb-1">
            <span class="status-indicator status-unhealthy"></span>Unhealthy
          </h6>
          <span id="unhealthyCount" class="fw-bold">0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Main content: map + legend -->
  <div class="row g-3">
    <div class="col-lg-9">
      <div id="map"></div>
    </div>
    <div class="col-lg-3">
      <div class="card">
        <div class="card-header">Legend</div>
        <div class="card-body">
          <p class="mb-2">
            <span class="status-indicator status-healthy"></span>
            Healthy (&gt;60%)
          </p>
          <p class="mb-2">
            <span class="status-indicator status-moderate"></span>
            Moderate (40-60%)
          </p>
          <p class="mb-2">
            <span class="status-indicator status-unhealthy"></span>
            Unhealthy (&lt;40%)
          </p>
          <hr/>
          <h6>Flight Info</h6>
          <p id="flightInfo" class="small text-muted mb-0">Loading…</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// TODO: auto update frequently
  // === CONFIGURATION ===
  const API_BASE = window.location.origin; // Use same origin as the page
  const UPDATE_INTERVAL = 20000; // Update every 20 seconds
  let autoUpdate = true;
  let updateTimer = null;
  let map = null;
  let markersLayer = null;
  let pathLayer = null;
  let heatLayer = null;
  let allPoints = [];

  // === MAP INITIALIZATION ===
  function initMap(centerLat, centerLon) {
    if (map) {
      map.remove();
    }

    map = L.map('map').setView([centerLat, centerLon], 18);
    
    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Initialize layers
    markersLayer = L.layerGroup().addTo(map);
    pathLayer = L.layerGroup().addTo(map);
  }

  // === HEALTH TO COLOR ===
  function healthToColor(health) {
    if (health >= 60) return '#28a745'; // Green
    if (health >= 40) return '#ffc107'; // Yellow
    return '#dc3545'; // Red
  }

  // === UPDATE MAP WITH DATA === 
  function updateMap(points) {
    if (!points || points.length === 0) return;

    // Clear existing layers
    if (markersLayer) markersLayer.clearLayers();
    if (pathLayer) pathLayer.clearLayers();
    if (heatLayer) map.removeLayer(heatLayer);

    // Create polyline for flight path
    const pathCoords = points.map(p => [p.lat, p.lon]);
    const path = L.polyline(pathCoords, {
      color: '#3388ff',
      weight: 3,
      opacity: 0.7
    }).addTo(pathLayer);

    // Add markers for each point
    points.forEach((point, index) => {
      const color = healthToColor(point.health_index);
      const marker = L.circleMarker([point.lat, point.lon], {
        radius: 5,
        fillColor: color,
        color: '#fff',
        weight: 1,
        opacity: 1,
        fillOpacity: 0.8
      });

      marker.bindPopup(`
        <strong>Frame ${point.frame_number}</strong><br/>
        Health: ${point.health_index.toFixed(1)}%<br/>
        Status: ${point.health_status}<br/>
        Time: ${point.timestamp}<br/>
        ${point.altitude ? `Altitude: ${point.altitude.toFixed(1)}m<br/>` : ''}
        <small>Lat: ${point.lat.toFixed(6)}, Lon: ${point.lon.toFixed(6)}</small>
      `);

      markersLayer.addLayer(marker);
    });

    // Add heatmap layer
    const heatData = points.map(p => [p.lat, p.lon, p.health_index / 100]);
    heatLayer = L.heatLayer(heatData, {
      radius: 20,
      blur: 15,
      maxZoom: 17,
      max: 1.0,
      gradient: {
        0.0: 'blue',
        0.5: 'yellow',
        1.0: 'red'
      }
    }).addTo(map);

    // Fit map to bounds
    if (points.length > 0) {
      const bounds = path.getBounds();
      map.fitBounds(bounds, { padding: [50, 50] });
    }
  }

  // === UPDATE STATS ===
  function updateStats(stats) {
    document.getElementById('totalPoints').textContent = stats.total_points || 0;
    document.getElementById('avgHealth').textContent = stats.average_health?.toFixed(1) || '-';
    document.getElementById('healthyCount').textContent = stats.healthy_count || 0;
    document.getElementById('moderateCount').textContent = stats.moderate_count || 0;
    document.getElementById('unhealthyCount').textContent = stats.unhealthy_count || 0;
    
    if (stats.bounds) {
      document.getElementById('flightInfo').textContent = 
        `Bounds: ${stats.bounds.min_lat.toFixed(6)}, ${stats.bounds.min_lon.toFixed(6)} to ${stats.bounds.max_lat.toFixed(6)}, ${stats.bounds.max_lon.toFixed(6)}`;
    }
  }

  // === FETCH DATA ===
  async function fetchData() {
    try {
      // Fetch all points
      const pointsRes = await fetch(`${API_BASE}/api/points`);
      const pointsData = await pointsRes.json();
      
      if (pointsData.success && pointsData.points) {
        allPoints = pointsData.points;
        
        // Initialize map if not done
        if (!map && allPoints.length > 0) {
          const firstPoint = allPoints[0];
          initMap(firstPoint.lat, firstPoint.lon);
        }
        
        // Update map
        updateMap(allPoints);
        
        // Update last update time
        if (pointsData.last_updated) {
          const updateTime = new Date(pointsData.last_updated);
          document.getElementById('lastUpdate').textContent = 
            `Last update: ${updateTime.toLocaleTimeString()}`;
        }
      }

      // Fetch stats
      const statsRes = await fetch(`${API_BASE}/api/stats`);
      const statsData = await statsRes.json();
      
      if (statsData.success) {
        updateStats(statsData);
      }
    } catch (error) {
      console.error('Error fetching data:', error);
      document.getElementById('lastUpdate').textContent = 'Error loading data';
    }
  }

  // === AUTO UPDATE TOGGLE ===
  function toggleAutoUpdate() {
    autoUpdate = !autoUpdate;
    document.getElementById('autoUpdateStatus').textContent = `Auto: ${autoUpdate ? 'ON' : 'OFF'}`;
    
    if (autoUpdate) {
      startAutoUpdate();
    } else {
      stopAutoUpdate();
    }
  }

  function startAutoUpdate() {
    if (updateTimer) clearInterval(updateTimer);
    updateTimer = setInterval(fetchData, UPDATE_INTERVAL);
  }

  function stopAutoUpdate() {
    if (updateTimer) {
      clearInterval(updateTimer);
      updateTimer = null;
    }
  }

  // === INITIALIZE ===
  fetchData(); // Load immediately
  if (autoUpdate) {
    startAutoUpdate();
  }
</script>
</body>
</html>
